name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Lint and format check
        run: |
          python3 -m pip install ruff==0.16.8
          ruff check asmevo/scripts tests
          ruff format --check asmevo/scripts tests
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Compile helpers
        run: python3 -m compileall -q asmevo/scripts tests
      - name: Exercise the example gate
        run: python3 asmevo/scripts/gate.py asmevo/assets/evaluation-template.json
      - name: Exercise the controller CLI
        run: python3 asmevo/scripts/controller.py --help
